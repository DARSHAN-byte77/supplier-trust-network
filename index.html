<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cotton Supplier Trust Network</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0b0f19; color: #e2e8f0; overflow-x: hidden; }
    #canvas-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; pointer-events: none; }
    .ui-container { position: relative; z-index: 10; max-width: 1100px; margin: 0 auto; padding: 20px; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid #1e293b; }
    h1 { font-size: 1.5rem; letter-spacing: 1px; color: #38bdf8; text-transform: uppercase; }
    .btn-primary { background: linear-gradient(135deg, #0284c7, #2563eb); color: #fff; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin: 20px 0; }
    .metric-card { background: rgba(15, 23, 42, 0.85); border: 1px solid #1e293b; border-radius: 8px; padding: 15px; backdrop-filter: blur(10px); }
    .metric-card p { font-size: 0.75rem; color: #94a3b8; font-weight: 600; }
    .metric-card h2 { font-size: 1.6rem; margin-top: 5px; color: #38bdf8; }
    .form-card { background: rgba(15, 23, 42, 0.85); border: 1px solid #1e293b; border-radius: 8px; padding: 20px; margin-bottom: 25px; backdrop-filter: blur(10px); }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 15px; }
    input, select { background: #0f172a; border: 1px solid #334155; color: #fff; padding: 10px; border-radius: 6px; width: 100%; }
    .supplier-list { display: flex; flex-direction: column; gap: 12px; }
    .supplier-card { background: rgba(15, 23, 42, 0.85); border: 1px solid #1e293b; border-radius: 8px; padding: 15px; display: flex; justify-content: space-between; align-items: center; backdrop-filter: blur(10px); }
    .supplier-info h3 { font-size: 1.1rem; color: #f8fafc; }
    .supplier-info p { font-size: 0.85rem; color: #64748b; margin-top: 4px; }
    .badge { background: #0284c7; color: #fff; padding: 3px 8px; border-radius: 4px; font-size: 0.75rem; }
    .trust-score { font-size: 1.2rem; font-weight: bold; color: #4ade80; }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  <div class="ui-container">
    <header>
      <h1>Supplier Trust Network</h1>
      <button class="btn-primary">Connect Wallet</button>
    </header>

    <div class="metrics-grid">
      <div class="metric-card"><p>TOTAL SUPPLIERS</p><h2 id="metric-total">0</h2></div>
      <div class="metric-card"><p>VERIFIED ON-CHAIN</p><h2 id="metric-verified">0</h2></div>
      <div class="metric-card"><p>AVG ON-TIME DELIVERY</p><h2 id="metric-otif">0%</h2></div>
      <div class="metric-card"><p>COMPOSITE TRUST</p><h2 id="metric-trust">0%</h2></div>
    </div>

    <div class="form-card">
      <h3 style="color:#38bdf8; font-size: 1rem;">Dynamic Trust Engine Parameters</h3>
      <form id="add-supplier-form">
        <div class="form-grid">
          <input type="text" id="supplierName" placeholder="Supplier Name" required>
          <input type="text" id="location" placeholder="Location" required>
          <input type="number" step="0.1" id="rating" placeholder="Rating (1-5)" min="1" max="5" required>
          <input type="number" id="otif" placeholder="OTIF % (0-100)" min="0" max="100" required>
          <select id="certification">
            <option value="ISO 9001 (Quality)">Cert: ISO 9001 (Quality)</option>
            <option value="GOTS Organic">Cert: GOTS Organic</option>
            <option value="Fair Trade Certified">Cert: Fair Trade Certified</option>
          </select>
          <button type="submit" class="btn-primary" style="grid-column: span 1;">Record to Trust Engine</button>
        </div>
      </form>
    </div>

    <div class="supplier-list" id="suppliers-container"></div>
  </div>

  <script>
    // 1. Three.js Background Visualization Setup
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 8);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    container.appendChild(renderer.domElement);

    const nodesGroup = new THREE.Group();
    scene.add(nodesGroup);

    function createNodeRing(count) {
      while(nodesGroup.children.length > 0){ nodesGroup.remove(nodesGroup.children[0]); }
      const radius = 4.5;
      const geom = new THREE.BoxGeometry(0.6, 0.4, 0.1);
      for(let i = 0; i < count; i++) {
        const angle = (i / count) * Math.PI * 2;
        const mat = new THREE.MeshBasicMaterial({ color: i % 2 === 0 ? 0x38bdf8 : 0x4ade80, wireframe: true });
        const mesh = new THREE.Mesh(geom, mat);
        mesh.position.set(Math.cos(angle) * radius, Math.sin(angle) * radius, 0);
        nodesGroup.add(mesh);
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      nodesGroup.rotation.z += 0.003;
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // 2. Metric Updating Logic
    function updateDashboardMetrics(suppliers) {
      if (!suppliers || suppliers.length === 0) return;
      const total = suppliers.length;
      const verifiedCount = suppliers.filter(s => s.status === 'Verified' || s.status === 'Active' || !s.status).length;
      const sumOtif = suppliers.reduce((acc, s) => acc + parseFloat(s.otif || 0), 0);
      const avgOtif = Math.round(sumOtif / total);
      const sumTrust = suppliers.reduce((acc, s) => acc + parseFloat(s.trustScore || 0), 0);
      const avgTrust = Math.round(sumTrust / total);

      document.getElementById('metric-total').textContent = total;
      document.getElementById('metric-verified').textContent = verifiedCount;
      document.getElementById('metric-otif').textContent = `${avgOtif}%`;
      document.getElementById('metric-trust').textContent = `${avgTrust}%`;
    }

    // 3. API Interactivity Logic
    function fetchSuppliers() {
      fetch('/api/suppliers')
        .then(res => res.json())
        .then(suppliers => {
          const containerEl = document.getElementById('suppliers-container');
          containerEl.innerHTML = '';
          suppliers.forEach(s => {
            const card = document.createElement('div');
            card.className = 'supplier-card';
            card.innerHTML = `
              <div class="supplier-info">
                <h3>${s.name} <span style="font-size:0.8rem; color:#94a3b8;">(${s.location})</span></h3>
                <p>Rating: ${s.rating} ★ | OTIF Delivery: ${s.otif}% | Certification: <span class="badge">${s.certification}</span></p>
              </div>
              <div class="trust-score">Trust Score: ${s.trustScore}%</div>
            `;
            containerEl.appendChild(card);
          });
          updateDashboardMetrics(suppliers);
          createNodeRing(Math.max(suppliers.length, 4));
        })
        .catch(err => console.error('Error fetching suppliers:', err));
    }

    document.getElementById('add-supplier-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const payload = {
        name: document.getElementById('supplierName').value,
        location: document.getElementById('location').value,
        rating: document.getElementById('rating').value,
        otif: document.getElementById('otif').value,
        certification: document.getElementById('certification').value
      };

      fetch('/api/suppliers', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(() => {
        document.getElementById('add-supplier-form').reset();
        fetchSuppliers();
      })
      .catch(err => console.error('Error adding supplier:', err));
    });

    fetchSuppliers();
  </script>
</body>
</html>
